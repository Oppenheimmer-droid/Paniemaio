# saas-edu/docker-compose.yml
version: '3.8'

services:

  # ─────────────────────────────────────
  # PostgreSQL 16
  # ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: saas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: saas_edu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────
  # Redis 7
  # ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: saas-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────
  # ChromaDB  ← puerto 8100 para no chocar con la API
  # ─────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: saas-chroma
    restart: unless-stopped
    ports:
      - "8100:8000"           # host:container
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ─────────────────────────────────────
  # Backend — FastAPI + Celery worker
  # ─────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saas-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Override para usar los nombres de servicio de docker-compose
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/saas_edu"
      DATABASE_URL_SYNC: "postgresql+psycopg2://postgres:postgres@postgres:5432/saas_edu"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://redis:6379/2"
      CHROMA_HOST: "chromadb"
      CHROMA_PORT: "8000"           # dentro de la red docker usa el puerto del contenedor
      UPLOAD_DIR: "/data/uploads"
      CHROMA_PERSIST_DIR: "/data/chroma"
      CORS_ORIGINS: '["http://localhost:3000","http://frontend:3000"]'
    volumes:
      - uploads_data:/data/uploads
      - chroma_data:/data/chroma
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    command: >
      sh -c "
        echo '⏳ Ejecutando migraciones...' &&
        alembic upgrade head &&
        echo '🌱 Seed inicial (solo si está vacío)...' &&
        python scripts/seed.py || true &&
        echo '🔧 Iniciando Celery worker en background...' &&
        celery -A app.workers.celery_app worker --loglevel=info --concurrency=2 &
        echo '🚀 Iniciando API...' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000
      "

  # ─────────────────────────────────────
  # Frontend — Next.js 14
  # ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: saas-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1"
      NODE_ENV: "production"
    depends_on:
      api:
        condition: service_healthy

# ─────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  chroma_data:
  uploads_data: